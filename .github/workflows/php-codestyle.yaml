name: Code style PHP

on:
  push:
    branches-ignore:
      - '**-dev'
  pull_request:

jobs:

  phpcs:
    runs-on: ubuntu-latest
    name: phpcs PHP/PHTML

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          extensions: gd,intl,mbstring,sqlite,zip
          coverage: none

      - run: composer install --no-progress

      - name: PHPCS
        run: composer webtrees-lib:phpcs
